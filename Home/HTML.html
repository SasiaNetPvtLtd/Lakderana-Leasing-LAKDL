function makeRequest(url,opt,type) {
var http_request = false;
if (window.XMLHttpRequest) {
    http_request = new XMLHttpRequest();
    if (http_request.overrideMimeType) {
        http_request.overrideMimeType('text/xml');
    }
} else if (window.ActiveXObject) { 
    try {
        http_request = new ActiveXObject("Msxml2.XMLHTTP");
    } catch (e) {
        try {
            http_request = new ActiveXObject("Microsoft.XMLHTTP");
        } catch (e) {}
    }
}
if (!http_request) {
    alert('Giving up :( Cannot create an XMLHTTP instance');
    return false;
}
 if(opt=='1'){
  http_request.onreadystatechange = function() { alertContents(http_request); };
  http_request.open('POST',url, true);
	 http_request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	 m_send_val = "chksql=get_advance_price_cal&rate="+unformat_noobject(document.Form1.RATE.value)+"&value="+unformat_noobject(document.Form1.GROSS_AMOUNT.value)+
	              "&terms="+document.Form1.PERIOD.value+"&freq="+document.Form1.REPAYMENT_INTERVAL.value+"&type="+document.Form1.PAYMENT_MODE.value+"&option="+opt+
	              "&last_rent=&sup_cr="+document.Form1.SUPPLIER_CREDIT.value+"&residual="+unformat_noobject(document.Form1.RESIDUAL_VALUE.value)+
	              "&supcrper=0&cashout="+document.Form1.CASH_OUTFLOW.value+"&trnsub="+document.Form1.TRANSACTION_SUB.value+"&nittype="+document.Form1.INTEREST_TYPE.value+"&nibsm="+unformat_noobject(document.Form1.NIBSM.value)+
	              "&trn_type="+document.Form1.TRANSACTION_TYPE.value+"&tax="+document.Form1.VAT_PERCENTAGE.value+"&tax_app="+document.Form1.VAT_PER_APP.value+"&installments=";
  http_request.send(m_send_val);
 }else{
  http_request.onreadystatechange = function() { alertGetContents(http_request,opt,type); };
  http_request.open('GET',url, true);
  http_request.send(null);
 }
}
function alertContents(http_request,type) {
 if (http_request.readyState == 4) {
    if (http_request.status == 200) {
         price_cal.innerHTML=http_request.responseText; 
    } else {
        alert('There was a problem with the request.');
    }
 }
}
function alertGetContents(http_request,opt,type) {
 if (http_request.readyState == 4) {
    if (http_request.status == 200) {
      if(opt=="2"){
         rec.innerHTML=http_request.responseText; 
      }else if(opt=="3"){
         document.Form1.tot_val.value=http_request.responseText; 
         f=document.Form1.hid_opt_val.value ;
         g=document.Form1.hid_win_opt.value ;
         if(parseFloat(unformat_noobject(document.Form1.tot_val.value))<=parseFloat(document.Form1.elements["BAL_AMOUNT_"+f].value)){
           popupwin.document.Form1.tot_val.value=document.Form1.tot_val.value; 
           popupwin.total.innerHTML=format_noobject(document.Form1.tot_val.value); 
           document.Form1.elements["SETT_AMOUN_"+f].value=format_noobject(document.Form1.tot_val.value); 
         }else{
           popupwin.document.Form1.elements['Text_standard'+g].value      ="NO";
           popupwin.document.Form1.elements['Text_sett_amount'+g].disabled=false;
           popupwin.document.Form1.elements['Text_standard'+g].checked    =false;
         }
      }else if(opt=="6"){
         document.Form1.tot_val.value=http_request.responseText; 
         document.Form1.elements["SETT_AMOUN_0"].value=format_noobject(document.Form1.tot_val.value); 
      }else if(opt=="5"){
         rec.innerHTML=http_request.responseText; 
      }else if(opt=="4"){
   				data_vec= new Array(); 
           var xmlbody=http_request.responseXML.documentElement;
           var vsize=0;
  				  for(var i=0;i<xmlbody.childNodes.length;i++){
    				 for(var j=0;j<xmlbody.childNodes[i].childNodes.length;j++){
      			  data_vec[vsize]=xmlbody.childNodes[i].childNodes[j].text;
       			vsize++;
    				}
   		   }
          addrow(data_vec,type);
      }
    } else {
        load_followup.innerHTML='';
    }
 }
}

function MyDialog(){
    this.valout   = new Array(10);
}		

function HelpBox(Start,End,Hid_No,Crit,Sql,IfCount) {
    oBj = new MyDialog();
    oBj.valout[1]  = " ";
    oBj.valout[2]  = " ";
    oBj.valout[3]  = " ";
	
popupwin = window.showModalDialog('https://dev-lakdl.sasianet.com:/myserver/servlet/LAKDL_AF_CO_Help_Servlet?class_in=LAKDL_AF_CO_help_select&Sql_in='+Sql+'&Start_in='+Start+'&End_in='+End+'&Crit_In='+Crit+'&Hid_No='+Hid_No+'&Max_in='+Hid_No+'&Args=', oBj,"dialogWidth:25em; dialogHeight:26em; center:yes; status:no");
	
	if(oBj.valout[1] !=" "){
	if(oBj.valout[1] !="Close"){
	if(oBj.valout[1]!="Prev"){
	if(oBj.valout[1]!="Next"){
		if(IfCount=="99"){
		help_update_value_assign_99();
		}
		if(IfCount=="1"){
		client_assign(oBj);
		}
		if(IfCount=="2"){
		receipt_assign(oBj);
		}
		if(IfCount=="4"){
		vehicle_assign(oBj);
		}
		if(IfCount=="3"){
		lease_assign(oBj);
		}
	}
	else{
		Next(oBj.valout[2],oBj.valout[3],Hid_No,Crit,Sql,IfCount);
		return false;
	} 
	}
	else{	
	Prev(oBj.valout[2],oBj.valout[3],Hid_No,Crit,Sql,IfCount);
	}	
	}		
	}	
}
